name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secret
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          if [ -z "$KS_PASSWORD" ]; then
            echo "::error::Add the repository secret KS_PASSWORD (Settings > Secrets and variables > Actions), then run this workflow again."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Echo.apk
          gh release create "android-${{ github.run_number }}" Echo.apk \
            --title "Echo for Android, build ${{ github.run_number }}" \
            --notes "On your phone, open https://github.com/jacovanstraten-glitch/echo/releases/latest/download/Echo.apk and install it." \
            --latest
