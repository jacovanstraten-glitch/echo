<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Echo</title>
<meta name="description" content="Capture ideas and record conversations, transcribed on your own PC and stored in your own OneDrive.">
<meta name="theme-color" content="#5B3FA0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; media-src 'self' blob: https:; connect-src 'self' blob: https://graph.microsoft.com https://login.microsoftonline.com https://login.live.com https://api.github.com https://*.1drv.com https://*.livefilestore.com https://*.sharepoint.com https://*.microsoftpersonalcontent.com https://*.onedrive.com; frame-src 'self' https://login.microsoftonline.com https://*.microsoftonline.com https://login.live.com https://*.live.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="gate" class="gate" hidden></div>

<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Echo</h1>
      <span class="sync" id="sync" aria-live="polite"></span>
      <span class="hdrbtns">
        <button class="iconbtn" id="btnImport" aria-label="Import audio files" title="Import audio files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></button>
        <button class="iconbtn" id="btnSettings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </span>
    </div>
    <div class="seg" id="viewSeg">
      <button data-view="all" aria-pressed="true">All</button>
      <button data-view="idea" aria-pressed="false">Ideas</button>
      <button data-view="recording" aria-pressed="false">Recordings</button>
      <button data-view="actions" aria-pressed="false">Actions</button>
    </div>
    <label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Search</span><input id="q" type="search" placeholder="Search ideas, transcripts and summaries" autocomplete="off"></label>
  </div>
</header>
<div class="wrap">
  <nav class="chips" id="chips" aria-label="Filter"></nav>
  <div id="notice"></div>
  <div id="uploads"></div>
  <main id="list"></main>
</div>
<div class="fabs">
  <button class="fab alt" id="fabIdea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg>New idea</button>
  <button class="fab" id="fabRec"><span class="recdot"></span>Record</button>
</div>
</div>

<input type="file" id="audioIn" accept="audio/*,.m4a,.mp3,.wav,.ogg,.opus,.webm,.aac,.mp4" multiple hidden>
<div class="dropov" id="dropOverlay" hidden><div>Drop audio files to add them to Echo</div></div>
<section class="panel" id="panel" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="vendor/msal-browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
